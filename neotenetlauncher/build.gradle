import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'net.neoforged.gradleutils' version '4.0.1'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'org.celestial_artistry.neotenet'
version = '1.21.1-' + gradleutils.gitInfo.abbreviatedId // NeoTenet

base {
    archivesName = "neotenet-launcher"
}

def neotaiyitistProjectDir = rootProject.layout.projectDirectory.dir("projects/neotenet")
def installerJarDir = neotaiyitistProjectDir.dir("build/libs")
def installerJarFile = installerJarDir.file("neotenet-${rootProject.version}-installer.jar")


dependencies {
    implementation("com.fasterxml.jackson.core:jackson-databind:2.20.1")

    compileOnly "cpw.mods:bootstraplauncher:${project.bootstraplauncher_version}"
}

tasks.register('launcherJar', ShadowJar) {
    manifest {
        attributes(
                "Implementation-Title": project.name,
                "Implementation-Version": version,
                "Main-Class": "org.teneted.neotenet.launcher.NeoTenetLauncher",
                "Launcher-Agent-Class": "org.teneted.neotenet.launcher.NeoTenetAgent",
        )
    }

    configurations = project.configurations.named('runtimeClasspath').map { [it] }

    from sourceSets.main.output

    dependsOn project(':neotenet').tasks.named('installerJar')


    from(installerJarFile.asFile) {
        into('META-INF/installer')
    }
}