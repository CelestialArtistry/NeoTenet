plugins {
    id 'java-library'
    id 'maven-publish'
}

sourceSets {
    main {
        java {
            rootProject.file('projects/neotenet-base/other-src/main/java')
        }
    }
}

dependencies {
    for (var asmModule : ["org.ow2.asm:asm", "org.ow2.asm:asm-commons", "org.ow2.asm:asm-tree", "org.ow2.asm:asm-util", "org.ow2.asm:asm-analysis"]) {
        implementation(asmModule) {
            // Vanilla ships with ASM 9.3 transitively (via their OpenID connect library dependency), we require
            // ASM in a more recent version and have to strictly require this to override the strict Minecraft version.
            version {
                strictly project.asm_version
            }
        }
    }
    implementation ("net.neoforged.fancymodloader:loader:${project.fancy_mod_loader_version}") {
        exclude group: 'org.slf4j'
        exclude group: 'net.fabricmc'
        // MC currently (as of 26.2-pre-1) uses the Unsafe-using artifact of LWJGL.
        // To avoid overriding that artifact, exclude it from here and rely on minecraft-dependencies to provide it.
        // We must specifically exclude the main LWJGL module, since FML depends on lwjgl-tinyfd.
        exclude group: 'org.lwjgl', module: 'lwjgl'
    }
    implementation ("net.neoforged.fancymodloader:earlydisplay:${project.fancy_mod_loader_version}") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.slf4j'
        exclude group: 'net.fabricmc'
    }
    implementation "net.neoforged:accesstransformers:${project.accesstransformers_version}"
    implementation "net.neoforged:bus:${project.eventbus_version}"
    implementation "net.neoforged:mergetool:${project.mergetool_version}:api"
    implementation "com.electronwill.night-config:core:${project.nightconfig_version}"
    implementation "com.electronwill.night-config:toml:${project.nightconfig_version}"
    implementation "org.apache.maven:maven-artifact:${project.apache_maven_artifact_version}"
    implementation "net.jodah:typetools:${project.typetools_version}"
    implementation "net.minecrell:terminalconsoleappender:${project.terminalconsoleappender_version}"
    implementation("net.fabricmc:sponge-mixin:${project.mixin_version}") { transitive = false }
    implementation ("net.neoforged:JarJarSelector:${project.jarjar_version}") {
        exclude group: 'org.slf4j'
    }
    implementation ("net.neoforged:JarJarMetadata:${project.jarjar_version}") {
        exclude group: 'org.slf4j'
    }

    // craftbukkit
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    implementation 'com.mysql:mysql-connector-j:9.6.0'
    implementation 'org.apache.logging.log4j:log4j-iostreams:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'
    implementation 'org.jline:jline:3.30.4'
    // spigot
    implementation 'commons-codec:commons-codec:1.22.0'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    // bukkit
    implementation 'org.yaml:snakeyaml:2.6'
    // LibraryLoader start
    implementation 'org.checkerframework:checker-qual:3.49.2'
    implementation 'org.eclipse.sisu:org.eclipse.sisu.inject:0.9.0.M2'
    implementation 'org.codehaus.plexus:plexus-interpolation:1.26'
    implementation 'org.codehaus.plexus:plexus-utils:4.0.3'
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
    implementation "org.apache.maven:maven-artifact:3.9.9"
    implementation 'org.apache.maven:maven-builder-support:3.9.6'
    implementation 'org.apache.maven:maven-model:3.9.6'
    implementation 'org.apache.maven:maven-model-builder:3.9.6'
    implementation 'org.apache.maven:maven-repository-metadata:3.9.6'
    implementation 'org.apache.maven:maven-resolver-provider:3.9.6'

    implementation 'org.apache.maven.resolver:maven-resolver-api:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-connector-basic:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-impl:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-named-locks:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-spi:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-transport-http:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-util:1.9.18'
    // LibraryLoader end

    // Start Mojang depends
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'com.azure:azure-json:1.4.0'
    implementation 'com.github.oshi:oshi-core:6.9.0'
    implementation 'com.microsoft.azure:msal4j:1.24.1'
    implementation 'com.mojang:authlib:9.0.75'
    implementation 'com.mojang:brigadier:1.3.10'
    implementation 'com.mojang:datafixerupper:10.0.21'
    implementation 'com.mojang:jtracy:1.0.37'
    implementation 'com.mojang:logging:1.7.12'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'io.netty:netty-buffer:4.2.15.Final'
    implementation 'io.netty:netty-codec-base:4.2.15.Final'
    implementation 'io.netty:netty-codec-compression:4.2.15.Final'
    implementation 'io.netty:netty-codec-http:4.2.15.Final'
    implementation 'io.netty:netty-common:4.2.15.Final'
    implementation 'io.netty:netty-handler:4.2.15.Final'
    implementation 'io.netty:netty-resolver:4.2.15.Final'
    implementation 'io.netty:netty-transport:4.2.15.Final'
    implementation 'io.netty:netty-transport-classes-epoll:4.2.15.Final'
    implementation 'io.netty:netty-transport-classes-kqueue:4.2.15.Final'
    implementation 'io.netty:netty-transport-native-epoll:4.2.15.Final:linux-x86_64'
    implementation 'io.netty:netty-transport-native-epoll:4.2.15.Final:linux-aarch_64'
    implementation 'io.netty:netty-transport-native-kqueue:4.2.15.Final:osx-x86_64'
    implementation 'io.netty:netty-transport-native-kqueue:4.2.15.Final:osx-aarch_64'
    implementation 'io.netty:netty-transport-native-unix-common:4.2.15.Final'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    // End Mojang depends

    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
    implementation(project(":neoforge-coremods"))
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    options.encoding = 'UTF-8'
    options.warnings = false
    options.compilerArgs << "-Xlint:-removal" << "-Xlint:-deprecation" << "-Xlint:-dep-ann" << "-Xlint:-varargs" << "-Xdiags:verbose"
}